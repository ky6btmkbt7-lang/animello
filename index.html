<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>animello ✦</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080912;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:18px 24px;border-bottom:1px solid #ffffff22;background:#ffffff0d;backdrop-filter:blur(20px);position:sticky;top:0}
.logo{font-size:26px;font-weight:900}.logo span{color:#32e5e1}
.page{max-width:1100px;margin:auto;padding:40px 22px}.hero{display:grid;grid-template-columns:280px 1fr;gap:35px;align-items:center;min-height:500px}
.poster{aspect-ratio:2/3;border-radius:28px;background:linear-gradient(145deg,#ff4fa3,#644cff,#32e5e1);display:grid;place-items:center;text-align:center;font-size:38px;font-weight:900;box-shadow:0 25px 80px #0008}
.kicker{color:#32e5e1;text-transform:uppercase;font-weight:800;letter-spacing:2px}.hero h1{font-size:80px;line-height:.9;margin:12px 0;letter-spacing:-5px}
.muted{color:#a8acbd;line-height:1.6}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #ffffff22;background:#ffffff10;padding:8px 12px;border-radius:999px}
.actions{display:flex;gap:10px;margin:22px 0}.btn{border-radius:14px;padding:13px 18px;border:1px solid #ffffff22;background:#ffffff10;color:white}.primary{border:0;background:linear-gradient(135deg,#ff4fa3,#ff77bb);font-weight:800}
.rating{display:flex;gap:25px}.rating b{color:white}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.poster{width:190px;margin:auto}.chips,.actions,.rating{justify-content:center}.hero h1{font-size:55px}}
</style>
</head>
<body>
<header><div class="logo">animello <span>✦</span></div></header>
<main class="page">
<section class="hero">
<div class="poster">ТВОЁ<br>ИМЯ</div>
<div>
<div class="kicker">Аниме дня</div>
<h1>Твоё имя</h1>
<p class="muted">2016 · фильм · ~1 ч 50 мин · Макото Синкай</p>
<div class="chips"><span class="chip">Романтика</span><span class="chip">Фэнтези</span><span class="chip">Драма</span></div>
<p class="muted">Мицуха и Таки загадочным образом меняются телами. Их история становится путешествием сквозь время, память и расстояние.</p>
<div class="actions"><button class="btn primary">▶ Смотреть</button><button class="btn">♡ В избранное</button></div>
<div class="rating"><span>Кинопоиск <b>8.4/10</b></span><span>Animello <b>Нет оценок</b></span></div>
</div>
</section>
</main>
</body>
</html>
